name: Keep Supabase awake

# Supabase Free pauses a project after 7 days without database activity.
# This workflow makes a tiny REST query once a day so the project stays warm.
# The query is rate-limited and RLS-protected; it returns 0 rows for an
# unauthenticated caller but still counts as activity on Supabase's side.

on:
  schedule:
    # Daily at 12:00 UTC. Cron is best-effort — GitHub may delay by minutes
    # during high load, which is fine for our 7-day window.
    - cron: '0 12 * * *'
  # Lets you click "Run workflow" in the Actions tab to test manually.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY repo secret."
            exit 1
          fi
          # Trim trailing slash on the URL so the path concat is clean.
          URL="${SUPABASE_URL%/}/rest/v1/clients?select=id&limit=1"
          echo "Pinging $URL"
          # -f makes curl fail on 4xx/5xx so the workflow goes red if Supabase
          # rejects the call (project paused, key rotated, etc).
          HTTP_CODE=$(curl -fsS -o /tmp/out -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Accept: application/json" \
            "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/out
          echo
          echo "Ping OK at $(date -u +%FT%TZ)"
